# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Phase 18B Render Blueprint. Repository configuration only until later subphases.
# First Blueprint create: enter sync:false placeholders in the Dashboard
#   WEB_ORIGIN=https://web.invalid
#   BETTER_AUTH_URL=https://api.invalid
#   VITE_API_BASE_URL=https://api.invalid
# Those values are provisioning-only. Later Blueprint syncs do not update sync:false.
# numInstances: 1 is the steady-state replica count. Render zero-downtime deploys
# may still overlap old and new API processes until SIGTERM of the old process.

previews:
  generation: "off"

databases:
  - name: notional-db
    postgresMajorVersion: "17"
    databaseName: notional
    region: singapore
    plan: 0.5c-1g
    diskSizeGB: 1
    connectionPool: none
    storageAutoscalingEnabled: false
    ipAllowList: []

services:
  - type: web
    name: notional-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    numInstances: 1
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    branch: main
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/package.json
        - packages/contracts/**
        - packages/db/**
        - packages/trading/**
        - scripts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
        - .dockerignore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notional-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: FAUCET_AMOUNT
        value: "100"
      - key: TRUST_PROXY
        value: "false"
      - key: LOG_LEVEL
        value: "info"

  - type: web
    name: notional-web
    runtime: static
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @notional/contracts build && pnpm --filter web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - scripts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=15552000
